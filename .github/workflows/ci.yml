name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Create, write and read a table as the owner
        run: |
          sudo podman exec circuit-sqlite bash -lc '
            set -eux
            sqlite3 --version
            db=/var/lib/example/app.db
            [ "$(stat -c "%U:%G %a" $db)" = "daemon:daemon 640" ]
            su -s /bin/sh daemon -c "sqlite3 $db \"CREATE TABLE IF NOT EXISTS t (n INTEGER); INSERT INTO t VALUES (6);\""
            sqlite3 $db "SELECT n FROM t LIMIT 1;" | grep -x 6
            [ "$(stat -c "%U:%G %a" $db)" = "daemon:daemon 640" ]
            [ "$(stat -c "%U:%G %a" /srv/example/root.db)" = "root:root 640" ]
          '
      - name: A link at the database path leaves its target as it was
        working-directory: examples/local
        run: |
          sudo podman exec circuit-sqlite bash -ec '
            echo keep > /root/keep
            chmod 600 /root/keep
            rm /var/lib/example/app.db
            ln -s /root/keep /var/lib/example/app.db
          '
          conn3x apply -auto-approve || true
          sudo podman exec circuit-sqlite bash -ec '
            [ "$(stat -c "%U:%G %a" /root/keep)" = "root:root 600" ]
            grep -qx keep /root/keep
            rm /var/lib/example/app.db
          '
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-sqlite bash -ec '
            [ "$(stat -c "%U:%G %a" /var/lib/example/app.db)" = "daemon:daemon 640" ]
          '
      - name: Root doesn't own a database on a path another account can change
        working-directory: examples/local
        run: |
          sudo podman exec circuit-sqlite bash -ec '
            install -d -m 755 /var/keep
            echo keep > /var/keep/root.db
            chmod 600 /var/keep/root.db
            chown daemon /srv
            mv /srv/example /srv/example.real
            su -s /bin/sh daemon -c "ln -s /var/keep /srv/example"
          '
          ! conn3x apply -auto-approve
          sudo podman exec circuit-sqlite bash -ec '
            [ "$(stat -c "%U:%G %a" /var/keep/root.db)" = "root:root 600" ]
            grep -qx keep /var/keep/root.db
            rm /srv/example
            mv /srv/example.real /srv/example
            chown root /srv
          '
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
